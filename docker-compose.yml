services:
  db:
    image: mysql:8.0
    container_name: clienttale_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: clienttale
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql  # This persists the data outside the container lifecycle

  backend:
    build: .
    container_name: clienttale_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=clienttale
    depends_on:
      - db

volumes:
  mysql_data:
