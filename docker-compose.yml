services:
  db:
    image: mysql:8.0
    container_name: clienttale_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: clienttale
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: clienttale_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=clienttale
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: clienttale_nginx
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  mysql_data: