<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Staff · ClientTale</title>
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">ClientTale</div>
    <div class="spacer"></div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="staff.html">Manage Staff</a>
      <a href="case.html">New Case</a>
      <button type="button" id="theme-toggle" class="secondary" style="margin-left:1.25rem;">Dark Mode</button>
      <span id="current-user" class="muted" style="margin-left:1.25rem;"></span>
      <a href="#" id="logout-btn" style="margin-left:1.25rem;">Sign Out</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h2>Add Staff Member</h2>
      <div id="add-error" class="error-msg hidden"></div>
      <form id="add-staff-form" class="form-grid">
        <div class="field">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" required>
        </div>
        <div class="field">
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" required>
        </div>
        <div class="field">
          <label for="role">Role</label>
          <select id="role">
            <option value="lawyer">Lawyer</option>
            <option value="paralegal">Paralegal</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="field span-2">
          <label for="staff-email">Email</label>
          <input type="email" id="staff-email">
        </div>
        <div class="field">
          <label for="new-staff-username">Username</label>
          <input type="text" id="new-staff-username" required>
        </div>
        <div class="field span-2">
          <label for="new-staff-password">Password</label>
          <input type="password" id="new-staff-password" required minlength="8">
        </div>
        <div class="field span-3">
          <button type="submit">Add Staff Member</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Lawyers</h2>
      <div id="lawyer-list"></div>
    </div>

    <div class="card">
      <h2>Paralegals</h2>
      <div id="paralegal-list"></div>
    </div>

    <div class="card">
      <h2>Admins</h2>
      <div id="admin-list"></div>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
